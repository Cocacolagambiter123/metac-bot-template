name: Forecast on new AI tournament questions

on:
  workflow_dispatch:
  schedule:
    - cron: "7,27,47 * * * *" # every 20 min, offset off the hour. Make sure to skip already-forecasted questions!

# Add concurrency group to prevent parallel runs
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false


# Forecasts on the live bot tournaments (FutureEval + MiniBench by default).
jobs:
  forecast_job:
    # Off until you switch it on, so nothing forecasts in a scored tournament
    # by accident: set the repository variable RUN_TOURNAMENT_BOT to true
    # (Settings -> Secrets and variables -> Actions -> Variables). Starting it
    # by hand with "Run workflow" always works.
    if: vars.RUN_TOURNAMENT_BOT == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest # determines the machine that will run the job - keep as is
    steps: # sets up the steps that will be run in order
      # setup repository with all necessary dependencies - keep as is
      - name: Check out repository
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.1"
      - name: Install dependencies
        run: uv sync --locked
      - name: Run bot
        run: |
          uv run python main.py
        # this reads the environment variables from the github repository.
        # Store under Settings --> Secrets and variables --> Actions
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }} # replace this with the name of the variable under which you stored your own Metaculus token
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ASKNEWS_CLIENT_ID: ${{ secrets.ASKNEWS_CLIENT_ID }}
          ASKNEWS_SECRET: ${{ secrets.ASKNEWS_SECRET }}
          ASKNEWS_API_KEY: ${{ secrets.ASKNEWS_API_KEY }}
          # Optional settings, stored as repository variables (not secrets):
          BOT_TOURNAMENTS: ${{ vars.BOT_TOURNAMENTS }} # e.g. "fall-futureeval-2026" to leave MiniBench out
          FORECAST_MODEL: ${{ vars.FORECAST_MODEL }} # e.g. "anthropic/claude-fable-5-1"
          HELPER_MODEL: ${{ vars.HELPER_MODEL }}
          FORECAST_EFFORT: ${{ vars.FORECAST_EFFORT }} # low, medium, high (default), xhigh or max
          MAX_CONCURRENT_AI_CALLS: ${{ vars.MAX_CONCURRENT_AI_CALLS }} # default 4; raise it as your AI account's limits grow
          USE_NUMERIC_MODEL: ${{ vars.USE_NUMERIC_MODEL }} # "true" to use the numeric model; off by default
          NUMERIC_MODEL_WEIGHT: ${{ vars.NUMERIC_MODEL_WEIGHT }} # 0 (default) = prompt anchor only; up to 1 = blend