name: Test Bot

on:
  workflow_dispatch:
    inputs:
      task:
        description: "What to run: forecasts on the bot-testing-area, or the numeric model's matching check on closed questions (submits nothing)"
        type: choice
        options:
          - test_questions
          - numeric_matching_check
        default: test_questions
      use_numeric_model:
        description: "Use the numeric model in this run (overrides the USE_NUMERIC_MODEL variable for this run only)"
        type: choice
        options:
          - repository variable
          - "true"
          - "false"
        default: repository variable
      numeric_model_weight:
        description: "Numeric model blend weight from 0 to 1 for this run (blank uses NUMERIC_MODEL_WEIGHT)"
        type: string
        default: ""
      tournaments:
        description: "For numeric_matching_check: comma-separated tournament IDs or slugs (blank = this season's FutureEval and MiniBench)"
        type: string
        default: ""

# Add concurrency group to prevent parallel runs
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false


# Daily job to run the simple forecast bot
jobs:
  forecast_job:
    runs-on: ubuntu-latest # determines the machine that will run the job - keep as is
    steps: # sets up the steps that will be run in order
      # setup repository with all necessary dependencies - keep as is
      - name: Check out repository
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.1"
      - name: Install dependencies
        run: uv sync --locked
      - name: Run unit tests
        run: uv run python -m unittest discover -s tests
      - name: Run bot
        if: inputs.task != 'numeric_matching_check'
        run: |
          uv run python main.py --mode test_questions
        # this reads the environment variables from the github repository.
        # Store under Settings --> Secrets and variables --> Actions
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }} # replace this with the name of the variable under which you stored your own Metaculus token
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ASKNEWS_CLIENT_ID: ${{ secrets.ASKNEWS_CLIENT_ID }}
          ASKNEWS_SECRET: ${{ secrets.ASKNEWS_SECRET }}
          ASKNEWS_API_KEY: ${{ secrets.ASKNEWS_API_KEY }}
          # Optional settings, stored as repository variables (not secrets):
          FORECAST_MODEL: ${{ vars.FORECAST_MODEL }} # e.g. "anthropic/claude-fable-5-1"
          HELPER_MODEL: ${{ vars.HELPER_MODEL }}
          FORECAST_EFFORT: ${{ vars.FORECAST_EFFORT }} # low, medium, high (default), xhigh or max
          MAX_CONCURRENT_AI_CALLS: ${{ vars.MAX_CONCURRENT_AI_CALLS }} # default 4; raise it as your AI account's limits grow
          # Numeric model (off unless USE_NUMERIC_MODEL is "true"); the run's inputs override the variables.
          USE_NUMERIC_MODEL: ${{ inputs.use_numeric_model != 'repository variable' && inputs.use_numeric_model || vars.USE_NUMERIC_MODEL }}
          NUMERIC_MODEL_WEIGHT: ${{ inputs.numeric_model_weight || vars.NUMERIC_MODEL_WEIGHT }} # 0 (default) = prompt anchor only
      - name: Check numeric model matching on closed questions
        if: inputs.task == 'numeric_matching_check'
        run: uv run python scripts/check_numeric_matching.py --tournaments "$CHECK_TOURNAMENTS"
        env:
          CHECK_TOURNAMENTS: ${{ inputs.tournaments }}
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }} # replace this with the name of the variable under which you stored your own Metaculus token
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ASKNEWS_CLIENT_ID: ${{ secrets.ASKNEWS_CLIENT_ID }}
          ASKNEWS_SECRET: ${{ secrets.ASKNEWS_SECRET }}
          ASKNEWS_API_KEY: ${{ secrets.ASKNEWS_API_KEY }}
          # Optional settings, stored as repository variables (not secrets):
          FORECAST_MODEL: ${{ vars.FORECAST_MODEL }} # e.g. "anthropic/claude-fable-5-1"
          HELPER_MODEL: ${{ vars.HELPER_MODEL }}
          FORECAST_EFFORT: ${{ vars.FORECAST_EFFORT }} # low, medium, high (default), xhigh or max
          MAX_CONCURRENT_AI_CALLS: ${{ vars.MAX_CONCURRENT_AI_CALLS }} # default 4; raise it as your AI account's limits grow
          # Numeric model (off unless USE_NUMERIC_MODEL is "true"); the run's inputs override the variables.
          USE_NUMERIC_MODEL: ${{ inputs.use_numeric_model != 'repository variable' && inputs.use_numeric_model || vars.USE_NUMERIC_MODEL }}
          NUMERIC_MODEL_WEIGHT: ${{ inputs.numeric_model_weight || vars.NUMERIC_MODEL_WEIGHT }} # 0 (default) = prompt anchor only
